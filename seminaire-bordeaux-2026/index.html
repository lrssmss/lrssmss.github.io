function abreviations(p){
  const txt = [p.badge, p.ref, p.fr, p.fr_trad, p.doc, p.extrait, ...(p.questions||[]), p.choix ? p.choix.enonce + ' ' + p.choix.options.map(o => o + ' ' + (KW_FR[o]||'')).join(' ') : ''].filter(Boolean).join(' \n ');
  const used = ABR.filter(a => a[0].test(txt));
  if(!used.length) return '';
  return `<details class="abrx" open><summary>Annexe : abréviations de la fiche (${used.length})</summary>${used.map(a=>`<div class="lx"><b>${esc(a[1])} <small>${esc(a[2])}</small></b><span>${esc(a[3])}</span></div>`).join('')}</details>`;
}

function lexique(p){
  const LX = DATA.lexique || []; if(!LX.length) return '';
  const txt = [p.ref, p.doc, ...p.questions, p.choix ? p.choix.enonce + ' ' + p.choix.options.join(' ') : ''].join(' ');
  const hit = e => [e.de, e.abr].filter(Boolean).some(k => k.split(/\s*[,/]\s*/).some(w => w.length > 2 && txt.includes(w.replace(/ \d.*$/,''))));
  const used = LX.filter(hit), row = e => `<div class="lx"><b>${esc(e.de)}${e.abr?` <small>${esc(e.abr)}</small>`:''}</b><span>${esc(e.fr)}</span></div>`;
  const cats = [...new Set(LX.map(e=>e.cat))];
  return `<aside class="panel lexi"><h3>Lexique</h3>${used.length?`<p class="note">Termes de votre pièce</p>${used.map(row).join('')}`:''}
    <details${used.length?'':' open'}><summary>Lexique complet (${LX.length})</summary>${cats.map(c=>`<h4>${esc(c)}</h4>${LX.filter(e=>e.cat===c).map(row).join('')}`).join('')}</details>${abreviations(p)}</aside>`;
}

// ---------- Assistant (Claude, sur le compte claude.ai de l'étudiant) ----------
const CHAT_ERR = {not_granted:"Vous avez refusé l'accès à Claude : l'assistant reste désactivé pour cette visite.", rate_limited:"Limite d'utilisation atteinte. Réessayez dans un moment.", session_expired:"Votre session claude.ai a expiré : reconnectez-vous puis rechargez la page.", prompt_too_large:"La conversation est trop longue : effacez-la pour repartir.", refused:"Claude n'a pas répondu à cette demande. Reformulez-la.", network:"Connexion à l'assistant impossible. Vérifiez le réseau et réessayez.", unavailable:"L'assistant est momentanément indisponible."};
function piecePrompt(p){
  const ch = p.choix ? `Mot-clé à trouver : ${p.choix.enonce} Propositions : ${p.choix.options.map((o,i)=>'('+'abc'[i]+') '+o).join(' ; ')}.` : '';
  const lx = (DATA.lexique||[]).map(e=>`${e.de}${e.abr?' ('+e.abr+')':''} = ${e.fr}`).join(' ; ');
  return `Tu es l'assistant d'un séminaire de Master 2 de droit comparé (Bordeaux) sur la vie privée en droit allemand. Tu aides un étudiant francophone, souvent non germanophone, à préparer sa pièce d'un puzzle collectif. Il la présentera en deux minutes lundi et fera deviner à la salle un mot-clé allemand.

Règles :
- Réponds en français, de façon brève et claire (au plus 150 mots sauf demande contraire). Garde les termes allemands, toujours avec leur traduction.
- Aide à comprendre : contexte historique, raisonnement de la juridiction, rapports entre le BVerfG et les juridictions civiles (BGH, OLG, LG), comparaison avec le droit français et la CEDH.
- Ne donne pas directement la lettre ni le mot-clé de la question « Mot-clé à trouver » : guide l'étudiant par des questions et des indices. S'il propose une réponse argumentée, dis-lui si son raisonnement tient.
- Sources : tu ne peux pas consulter Internet. Quand tu suggères une source, indique où la chercher (bundesverfassungsgericht.de, servat.unibe.ch/dfr pour les anciennes décisions du BVerfG, gesetze-im-internet.de pour les lois, HUDOC pour la CEDH, EUR-Lex, ouvrages et revues) et précise qu'il faut vérifier la référence. N'invente jamais de référence, de numéro de page ni de citation ; si tu n'es pas sûr, dis-le.
- Reste sur le sujet de la pièce et du séminaire.

La pièce de l'étudiant (n° ${p.id}, ${p.eleve}${p.groupe?', groupe « '+p.groupe+' »':''}) :
Référence : ${p.ref}
Faits : ${p.doc}
${p.extrait?'Extrait : '+p.extrait+'\n':''}Questions : ${p.questions.map((q,i)=>(i+1)+') '+q).join(' ')}
${ch}

Lexique du séminaire : ${lx}`;
}
// Hors de claude.ai (ex. lukas.rass-masson.eu) : adresse du relais Cloudflare Worker, vide = assistant masqué.
const CHAT_ENDPOINT = 'https://puzzle-assistant.lukasrassmasson.workers.dev';
async function remoteSample(pieceId, turns, {signal, onText}){
  let r;
  try{ r = await fetch(CHAT_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({piece: pieceId, messages: turns}), signal}); }
  catch(e){ throw {code: signal && signal.aborted ? 'cancelled' : 'network'}; }
  if(!r.ok){ let c = 'error'; try{ c = (await r.json()).code || c; }catch(e){} throw {code: c}; }
  const rd = r.body.getReader(), dec = new TextDecoder(); let text = '';
  try{ for(;;){ const {done, value} = await rd.read(); if(done) break; text += dec.decode(value, {stream:true}); onText && onText({text}); } }
  catch(e){ throw {code: signal && signal.aborted ? 'cancelled' : 'network', text}; }
  return {text, truncated:false};
}
const mdChat = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/^#{1,4}\s+/gm,'');
async function initChat(p){
  const box = $('#chat'); if(!box) return;
  let sample = null; try{ sample = await (window.claude && window.claude.use ? window.claude.use('sample') : null); }catch(e){}
  const remote = !sample && !!CHAT_ENDPOINT;
  if((!sample && !remote) || $('#chat')!==box) return;
  const turns = []; let ctl = null;
  box.hidden = false;
  box.innerHTML = `<div class="row" style="justify-content:space-between"><h3>Assistant de la pièce</h3><button class="btn" id="chatClear" type="button">Effacer</button></div>
    <p class="note">Posez vos questions sur votre pièce : contexte, raisonnement du juge, sources à consulter. L'assistant vous guide vers le mot-clé sans vous le donner. Il ne consulte pas Internet : vérifiez toujours les références qu'il propose. ${remote ? 'Vos messages sont transmis à Claude (Anthropic) pour la seule durée de la séance ; n\'y mettez pas de données personnelles.' : 'Il utilise votre propre compte Claude, qui vous demandera votre accord au premier message.'}</p>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form class="ask" id="ask"><label for="q2" class="sr">Votre question</label><textarea id="q2" rows="2" placeholder="Votre question sur la pièce ${p.id}"></textarea><div class="row"><button class="btn primary" id="send" type="submit">Envoyer</button><button class="btn" id="stop" type="button" hidden>Arrêter</button></div></form>
    <p class="note err" id="chatErr" hidden></p>`;
  const msgs = $('#msgs'), ta = $('#q2'), err = $('#chatErr');
  const SUG = ['Explique-moi le contexte de cette décision', 'Quelles sources lire pour aller plus loin ?', 'Donne-moi un indice pour le mot-clé', 'Quel lien avec le droit français ?'];
  $('#chips').innerHTML = SUG.map(t=>`<button type="button" class="chip-q">${esc(t)}</button>`).join('');
  const bubble = (role, text) => { const d = document.createElement('div'); d.className = 'msg ' + role; if(role === 'assistant') d.innerHTML = mdChat(text); else d.textContent = text; msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d; };
  async function send(q){
    q = q.trim(); if(!q || ctl) return;
    err.hidden = true; bubble('user', q); ta.value = '';
    turns.push({role:'user', content:q});
    const hist = turns.slice(-12); if(hist[0].role !== 'user') hist.shift();
    if(!remote) hist[0] = {role:'user', content: piecePrompt(p) + '\n\nPremière question de l\'étudiant : ' + hist[0].content};
    const out = bubble('assistant', '…'); ctl = new AbortController(); $('#send').disabled = true; $('#stop').hidden = false;
    try{
      const r = remote ? await remoteSample(p.id, hist, {signal:ctl.signal, onText:({text})=>{ out.innerHTML = mdChat(text); msgs.scrollTop = msgs.scrollHeight; }}) : await sample(hist, {cache:false, signal:ctl.signal, onText:({text})=>{ out.innerHTML = mdChat(text); msgs.scrollTop = msgs.scrollHeight; }});
      out.innerHTML = mdChat(r.text); turns.push({role:'assistant', content:r.text});
      if(r.truncated) bubble('note', 'Réponse coupée : demandez la suite.');
    }catch(e){
      if(e && e.text){ out.textContent = e.text + ' [interrompu]'; turns.push({role:'assistant', content:e.text}); }
      else { out.remove(); turns.pop(); }
      if(!e || e.code !== 'cancelled'){ err.textContent = (e && CHAT_ERR[e.code]) || "L'assistant n'a pas pu répondre. Réessayez."; err.hidden = false; }
      if(e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'capability_disabled' || e.code === 'capability_removed')){ $('#ask').hidden = true; $('#chips').hidden = true; }
    }finally{ ctl = null; $('#send').disabled = false; $('#stop').hidden = true; }
  }
  $('#ask').addEventListener('submit', e=>{ e.preventDefault(); send(ta.value); });
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(ta.value); }});
  $('#stop').onclick = ()=>{ if(ctl) ctl.abort(); };
  $('#chatClear').onclick = ()=>{ if(ctl) ctl.abort(); turns.length = 0; msgs.innerHTML = ''; err.hidden = true; };
  $('#chips').addEventListener('click', e=>{ const b = e.target.closest('.chip-q'); if(b) send(b.textContent); });
}

  $('#all').onclick = ()=>{ confirmAll='all'; viewProf(); };
  $('#reset').onclick = ()=>{ confirmAll='reset'; viewProf(); };
  if($('#yes')){ $('#yes').onclick = ()=>{ if(confirmAll==='all') state.revealed = DATA.pieces.map(x=>x.id); else { state = {revealed:[],absent:[]}; current=null; } confirmAll=false; save(); viewProf(); }; $('#no').onclick = ()=>{ confirmAll=false; viewProf(); }; }
  if($('#rev')) $('#rev').onclick = ()=>{ const id = current; if(isRev(id)) state.revealed = state.revealed.filter(x=>x!==id); else state.revealed.push(id); save(); viewProf(); };
  if($('#abs')) $('#abs').onclick = ()=>{ const id = current; if(isAbs(id)) state.absent = state.absent.filter(x=>x!==id); else state.absent.push(id); save(); viewProf(); };
}
function reading(){
  return `<div class="panel"><h2>Lire l'image</h2><div class="reading">
    <div><h3>Fondations et presse (L1, L2)</h3><p>Le BVerfG (Cour constitutionnelle fédérale) fonde le droit de la personnalité sur les art. 2 I et 1 I GG, le fait rayonner sur le droit civil (Lüth) et le met en balance avec les libertés de l'art. 5 GG.</p></div>
    <div><h3>Juge civil et dialogue (L3, L4)</h3><p>Le BGH (Cour fédérale de justice) a créé l'APR (allgemeines Persönlichkeitsrecht, droit général de la personnalité, 1954) et sa sanction (1958, 1961) ; le BVerfG ne contrôle que le « droit constitutionnel spécifique » (spezifisches Verfassungsrecht, arrêt Heck). La CEDH a corrigé, le BVerfG s'est adapté, puis s'est saisi de la Charte.</p></div>
    <div><h3>Les sphères et la clé (L5, centre)</h3><p>Autour de la dignité (art. 1 I GG), la protection décroît de l'intime au social : le cœur est intangible, le reste se pèse. L'APR gagne de nouveaux terrains : famille, identité, numérique.</p></div>
  </div></div>`;
}
function route(){
  const h = location.hash.replace('#','');
  if(h==='prof') viewProf(); else if(/^p-\d+$/.test(h)) viewPiece(+h.slice(2)); else viewHome();
}
load();
fetch('pieces.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ DATA = d; route(); window.addEventListener('hashchange', route); })
  .catch(()=>{ $('#app').innerHTML = '<p class="err">Les pièces n\'ont pas pu être chargées. Le fichier pieces.json doit se trouver dans le même dossier que cette page (et la page doit être servie par un serveur web, pas ouverte en local).</p>'; });
})();
